services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Defaults for running the full stack via compose (the dev `postgres`
      # and `waha` containers, resolved by Docker network service name).
      #
      # These are DEFAULTS, not overrides: Compose interpolates ${VAR} from
      # the `.env` file in this directory (and from the shell environment),
      # so a production `.env` with a real
      # `DATABASE_URL=postgres://...@your-homelab-postgres/...` wins and is
      # passed through unchanged. Only when the variable is unset/empty do
      # the dev-container values below apply.
      #
      # Consequence for local dev: if your `.env` sets DATABASE_URL to the
      # host-facing form (localhost:55433, as in .env.example), the `app`
      # container will use that literal value and fail to reach Postgres.
      # For compose-based dev either leave DATABASE_URL/WAHA_URL out of
      # `.env` entirely, or set them to the service-name form shown here.
      DATABASE_URL: ${DATABASE_URL:-postgres://open_party:open_party@postgres:5432/open_party_dev}
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - waha

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    volumes:
      - waha-sessions:/app/.sessions
    # No published ports: WAHA is reachable only from `app` over the
    # internal Docker network (http://waha:3000) — never from the
    # Tailnet or Funnel (plan.md §16, §19).

  postgres:
    profiles: ["dev"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: open_party
      POSTGRES_PASSWORD: open_party
      POSTGRES_DB: open_party_dev
    ports:
      # Deliberately not 5432: this project's premise is reusing an existing
      # homelab Postgres, which commonly already owns the conventional port
      # (the same collision already hit postgres-test on 5433).
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  postgres-test:
    profiles: ["dev"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: open_party
      POSTGRES_PASSWORD: open_party
      POSTGRES_DB: open_party_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  waha-sessions:
  postgres-dev-data:
